name: Go release
#
on:
  release:
    types: [published]
#
permissions:
  contents: write
#
jobs:
  build:
    runs-on: ubuntu-latest
    #
    steps:
    - uses: actions/checkout@v4
    #
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        cache: true
    #
    - name: Build go scaffold
      shell: bash
      env:
        # Stamped into the binary, so `scaffold --version` matches the tag.
        VERSION: ${{ github.ref_name }}
      run: sh build.sh
    #
    - name: Upload go-scaffold
      uses: actions/upload-artifact@v4
      with:
        name: go-scaffold
        path: /tmp/bin/go-scaffold.tar.gz
    #
    - name: Release go-scaffold
      uses: softprops/action-gh-release@v2
      with:
        body: "# Release ${{ github.ref_name }}\n"
        files: |
          LICENSE
          /tmp/bin/go-scaffold.tar.gz
