name: Go Build
#
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
permissions:
  contents: read
#
concurrency:
  # A new push cancels the runs still in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
#
jobs:
  docs:
    # Gate sul backlog: id univoci, vocabolario, titoli milestone coerenti, e la
    # roadmap committata allineata al backlog (è generata, non scritta a mano).
    name: backlog & pagine generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: backlog-lint
        run: python3 docs/scripts/backlog-lint.py
      - name: generated-pages-check
        run: python3 docs/scripts/generate-roadmap.py --check

  extension:
    # Niente verificava l'estensione a ogni push: `vscode-publish.yml` la compila
    # solo al momento di pubblicarla, cioè troppo tardi.
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Il bundle di produzione è ciò che finisce sui marketplace: va provato qui,
      # non scoperto rotto durante il publish su tag.
      - run: npm run vscode:prepublish

  lint:
    # gofmt + go vet non coprono i valori di ritorno ignorati: il bug più costoso
    # dell'audit 2026-08-11 era un errore di filepath.Walk scartato in silenzio.
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true
      # v9: la v6 supporta solo golangci-lint v1 e rifiuta la nostra config v2
      # ("golangci-lint v2 is not supported by golangci-lint-action v6").
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22.x', '1.23.x', '1.24.x' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race ./...

  generated-project-builds:
    # The whole point of the CLI is to emit compilable code, so the generated
    # project is built for real: unit tests only check syntax and formatting.
    name: generated project compiles
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true

      - name: Build the CLI
        run: go build -o /tmp/scaffold .

      - name: Generate a project
        run: |
          mkdir -p /tmp/gen/github.com/acme/myservice
          cd /tmp/gen/github.com/acme/myservice
          /tmp/scaffold init

      - name: Compile what was generated
        working-directory: /tmp/gen/github.com/acme/myservice
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Run the generated project's own tests
        working-directory: /tmp/gen/github.com/acme/myservice
        run: go test ./...

      - name: Smoke test the health endpoint
        working-directory: /tmp/gen/github.com/acme/myservice
        env:
          HTTP_ADDR: 127.0.0.1:18080
          APP_ENV: runner
          DB_HOST: ""
        run: |
          go build -o /tmp/svc ./cmd
          /tmp/svc & pid=$!
          for _ in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS --max-time 5 -o /dev/null -w 'health: HTTP %{http_code}\n' http://127.0.0.1:18080/health
          kill -TERM $pid
          wait $pid || true
