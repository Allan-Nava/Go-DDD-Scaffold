name: Go Build
#
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
permissions:
  contents: read
#
concurrency:
  # A new push cancels the runs still in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
#
jobs:
  docs:
    # Gate on the backlog: unique ids, vocabulary, consistent milestone titles, and
    # the committed roadmap in line with the backlog (it is generated, not hand-written).
    name: backlog & generated pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: backlog-lint
        run: python3 docs/scripts/backlog-lint.py
      - name: generated-pages-check
        run: python3 docs/scripts/generate-roadmap.py --check

  extension:
    # Nothing checked the extension on every push: `vscode-publish.yml` only builds
    # it at publish time, which is too late.
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The production bundle is what ends up on the marketplaces: it has to be
      # tried here, not discovered broken during the publish on a tag.
      - run: npm run vscode:prepublish

  lint:
    # gofmt + go vet do not cover ignored return values: the most expensive bug of
    # the 2026-08-11 audit was a filepath.Walk error silently discarded.
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      # v9: v6 only supports golangci-lint v1 and rejects our v2 config
      # ("golangci-lint v2 is not supported by golangci-lint-action v6").
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22.x', '1.23.x', '1.24.x' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race ./...

  generated-project-builds:
    # The whole point of the CLI is to emit compilable code, so the generated
    # project is built for real: unit tests only check syntax and formatting.
    name: generated project compiles
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Build the CLI
        run: go build -o /tmp/scaffold .

      - name: Generate a project
        run: |
          mkdir -p /tmp/gen/github.com/acme/myservice
          cd /tmp/gen/github.com/acme/myservice
          /tmp/scaffold init
          # A second bounded context, with a multi-word entity: names of a
          # different length are what breaks gofmt alignment in a template.
          /tmp/scaffold add module --entity InvoiceLine billing

      - name: Compile what was generated
        working-directory: /tmp/gen/github.com/acme/myservice
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Run the generated project's own tests
        working-directory: /tmp/gen/github.com/acme/myservice
        run: go test ./...

      # Started exactly like `make run` does: APP_ENV=local loads env/.env.local,
      # with no DB_HOST override and no MySQL on the runner. This is the path a
      # user takes first; the old smoke test used APP_ENV=runner and skipped it.
      - name: Smoke test the health endpoint (like make run)
        working-directory: /tmp/gen/github.com/acme/myservice
        env:
          HTTP_ADDR: 127.0.0.1:18080
          APP_ENV: local
        run: |
          go build -o /tmp/svc ./cmd
          /tmp/svc & pid=$!
          for _ in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS --max-time 5 -o /dev/null -w 'health: HTTP %{http_code}\n' http://127.0.0.1:18080/health
          # Both modules are mounted and work without a database (memory fallback).
          curl -fsS --max-time 5 -H 'Content-Type: application/json' -d '{"name":"ci"}' http://127.0.0.1:18080/api/catalog
          echo
          curl -fsS --max-time 5 -o /dev/null -w 'GET /api/billing: HTTP %{http_code}\n' http://127.0.0.1:18080/api/billing
          kill -TERM $pid
          wait $pid || true
