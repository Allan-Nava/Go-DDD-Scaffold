name: Pages

# Publishes docs/ to GitHub Pages. The site is a single static page with no
# build step and no external requests: the job uploads the directory as it is
# committed. Same layout as the other projects (latencyprobe, segcheck).
#
# Requires Settings → Pages → Source = "GitHub Actions" (already set).

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
