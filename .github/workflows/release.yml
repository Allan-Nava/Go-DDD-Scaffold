name: Build Release
#
# One release path, no third-party action: Go builds the 8 binaries, the
# preinstalled gh CLI uploads them. It replaces Allan-Nava/go-release.action
# (which received a contents:write token inside a container and silently fell
# back to its own build when ./build.sh was not executable — that is what broke
# every release after v0.7.7) and go-release.yml (a second, linux-only path
# publishing the same thing).
on:
  release:
    # Only `published`: a bare `on: release` also fires on edited/deleted.
    types: [published]
  workflow_dispatch:
    # Builds (or rebuilds) the assets of an existing tag; the release is created
    # if it does not exist yet. A release created with GITHUB_TOKEN does not
    # fire `release: published`, so this does not run twice.
    inputs:
      tag:
        description: "Tag to release, e.g. v0.9.0"
        required: true
#
permissions:
  contents: read
#
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
#
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
#
jobs:
  prepare:
    name: release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release when started by hand
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            # --verify-tag: never create a tag here, only a release for a pushed one.
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi

  build:
    name: release ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      # The minimum to upload assets to the release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        id: build
        env:
          VERSION: ${{ env.TAG }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: echo "archive=$(sh build.sh)" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        # --clobber: re-running the workflow replaces the assets instead of failing.
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
