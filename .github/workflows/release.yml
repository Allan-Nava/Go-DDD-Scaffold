name: Build Release
#
on:
  release:
    # Solo `published`: con il bare `on: release` il workflow riparte anche su
    # edited/unpublished/deleted, ripubblicando gli stessi asset.
    types: [published]
#
permissions:
  contents: read
#
jobs:
  release:
    # Una matrice invece di 8 job copiaincollati: i nomi dei job derivano dalla
    # coppia goos/goarch, quindi non possono più mentire (c'erano tre etichette
    # sbagliate — "macos/32" per darwin/amd64, "linux/386" per arm, "linux/amd64"
    # per arm64 — e darwin/amd64 era duplicato in due job, mentre darwin/arm64
    # non veniva pubblicato affatto).
    name: release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      # Il minimo per caricare gli asset sulla release: era `write-all` su ognuno
      # degli 8 job, con una action di terze parti nello stesso step.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - name: compile and release
        # Pinnata al SHA, non al tag: `@v1.5.01` è mutabile e chi controlla il
        # tag potrebbe riscrivere gli asset di release di questo repo.
        uses: Allan-Nava/go-release.action@ad979660e82cf6cd6cf4050bbec45fd4a26d6d25 # v1.5.01
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTRA_FILES: "LICENSE"
          CMD_PATH: "main.go"
          # BUILD_ARGS e PROJECT_NAME sono deliberatamente assenti: l'action li
          # ignora quando il repo ha un ./build.sh eseguibile (prende il nostro,
          # e sovrascrive PROJECT_NAME con il basename del repo). I flag di build
          # -trimpath/-ldflags e il nome dell'output vivono in build.sh.
