name: Build Release
#
on:
  release:
    # Only `published`: with a bare `on: release` the workflow also restarts on
    # edited/unpublished/deleted, republishing the same assets.
    types: [published]
#
permissions:
  contents: read
#
jobs:
  release:
    # One matrix instead of 8 copy-pasted jobs: the job names come from the
    # goos/goarch pair, so they can no longer lie (there were three wrong
    # labels — "macos/32" for darwin/amd64, "linux/386" for arm, "linux/amd64"
    # for arm64 — and darwin/amd64 was duplicated in two jobs, while darwin/arm64
    # was not published at all).
    name: release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      # The minimum to upload assets to the release: it was `write-all` on each
      # of the 8 jobs, with a third-party action in the same step.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: compile and release
        # Pinned to the SHA, not the tag: `@v1.5.01` is mutable and whoever controls
        # the tag could rewrite this repo's release assets.
        uses: Allan-Nava/go-release.action@ad979660e82cf6cd6cf4050bbec45fd4a26d6d25 # v1.5.01
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTRA_FILES: "LICENSE"
          CMD_PATH: "main.go"
          # BUILD_ARGS and PROJECT_NAME are deliberately absent: the action ignores
          # them when the repo has an executable ./build.sh (it takes ours, and
          # overwrites PROJECT_NAME with the repo's basename). The -trimpath/-ldflags
          # build flags and the output name live in build.sh.
