name: 'Vscode Extension Publish'
#
on:
  push:
    # Any tag is a trigger: what decides whether to publish is the `version` in
    # extensions/vscode/package.json, not the tag (see the `decide` job). So the
    # repo's normal tags are enough, with no extra ceremony.
    tags:
      - "v*"
      - "vscode-v*"
  # Manual republish without having to create a tag.
  workflow_dispatch:
#
permissions:
  contents: read
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
#
defaults:
  run:
    # A `run: cd extensions/vscode` would be a no-op: every step opens a new
    # shell. The path has to be declared here.
    working-directory: extensions/vscode
#
jobs:
  decide:
    # In this repo every commit carries a tag, but a version published on the
    # Marketplace is **immutable**: republishing the same one fails, and publishing
    # a new one on every commit notifies users about changes that often do not
    # even touch the extension. So the tag is only a trigger: it publishes if and
    # only if the declared version is not online yet.
    name: needs publishing?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ID="$(node -p "const p=require('./package.json'); p.publisher+'.'+p.name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Public gallery, no token needed.
          PUBLISHED="$(curl -sS -X POST \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json;api-version=7.1-preview.1' \
            -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$ID\"}]}],\"flags\":914}" \
            | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                const e=(JSON.parse(s).results?.[0]?.extensions)||[];
                console.log(e.length ? e[0].versions.map(v=>v.version).join(' ') : '');
              });")"
          echo "already published: ${PUBLISHED:-none}"

          if echo " $PUBLISHED " | grep -q " $VERSION "; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ID $VERSION is already on the Marketplace: nothing to publish. To release, raise \"version\" in extensions/vscode/package.json."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ID $VERSION is not published yet: going ahead."
          fi

  verify:
    # Nothing that fails the gates gets published: `go.yml` does not run on a tag
    # (it only reacts to pushes to main and to PRs), so the check is repeated here.
    name: verify
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  package:
    name: package
    needs: [decide, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci

      # --no-dependencies: the extension has no runtime dependencies, so vsce
      # must neither resolve nor include them.
      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out extension.vsix

      # An artifact and not a GitHub Release on purpose: creating a release would
      # trigger `release.yml` and `go-release.yml` (which react to
      # `release: published`), and they would publish the Go CLI binaries
      # inside an extension release.
      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: go-ddd-scaffold-${{ needs.decide.outputs.version }}-vsix
          path: extensions/vscode/extension.vsix
          if-no-files-found: error

  publish:
    name: publish
    needs: [decide, package]
    runs-on: ubuntu-latest
    env:
      # Read here so the steps' `if`s can check whether they are present:
      # without the secret the step is skipped instead of failing.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce@3 publish --no-dependencies

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1 publish --no-dependencies

      - name: Summary
        run: |
          {
            echo "### VS Code extension $VERSION"
            if [ -n "$VSCE_PAT" ]; then
              echo "- Visual Studio Marketplace: published"
            else
              echo "- Visual Studio Marketplace: **skipped**, the \`VSCE_PAT\` secret is missing"
            fi
            if [ -n "$OVSX_PAT" ]; then
              echo "- Open VSX: published"
            else
              echo "- Open VSX: **skipped**, the \`OVSX_PAT\` secret is missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
#
