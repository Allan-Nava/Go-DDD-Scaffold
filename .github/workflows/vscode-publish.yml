name: 'Vscode Extension Publish'
#
on:
  push:
    # Qualunque tag fa da innesco: a decidere se pubblicare e la `version` in
    # extensions/vscode/package.json, non il tag (vedi il job `decide`). Cosi i
    # tag normali del repo bastano, senza cerimonie aggiuntive.
    tags:
      - "v*"
      - "vscode-v*"
  # Ripubblicazione manuale senza dover creare un tag.
  workflow_dispatch:
#
permissions:
  contents: read
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
#
defaults:
  run:
    # Un `run: cd extensions/vscode` sarebbe un no-op: ogni step apre una shell
    # nuova. Il path va dichiarato qui.
    working-directory: extensions/vscode
#
jobs:
  decide:
    # In questo repo ogni commit porta un tag, ma una versione pubblicata sul
    # Marketplace e **immutabile**: ripubblicare la stessa fallisce, e pubblicarne
    # una nuova a ogni commit notifica gli utenti per modifiche che spesso non
    # toccano nemmeno l'estensione. Quindi il tag fa solo da innesco: si pubblica
    # se e solo se la version dichiarata non e ancora online.
    name: serve pubblicare?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ID="$(node -p "const p=require('./package.json'); p.publisher+'.'+p.name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Gallery pubblica, nessun token necessario.
          PUBLISHED="$(curl -sS -X POST \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json;api-version=7.1-preview.1' \
            -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$ID\"}]}],\"flags\":914}" \
            | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                const e=(JSON.parse(s).results?.[0]?.extensions)||[];
                console.log(e.length ? e[0].versions.map(v=>v.version).join(' ') : '');
              });")"
          echo "gia pubblicate: ${PUBLISHED:-nessuna}"

          if echo " $PUBLISHED " | grep -q " $VERSION "; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ID $VERSION e gia sul Marketplace: niente da pubblicare. Per rilasciare, alza \"version\" in extensions/vscode/package.json."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ID $VERSION non e ancora pubblicata: si procede."
          fi

  verify:
    # Non si pubblica cio che non passa i gate: su un tag `go.yml` non gira
    # (reagisce solo a push su main e alle PR), quindi il controllo va rifatto qui.
    name: verify
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  package:
    name: package
    needs: [decide, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci

      # --no-dependencies: l'estensione non ha dipendenze runtime, quindi vsce
      # non deve ne risolverle ne includerle.
      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out extension.vsix

      # Artifact e non GitHub Release di proposito: creare una release farebbe
      # scattare `release.yml` e `go-release.yml` (che reagiscono a
      # `release: published`), i quali pubblicherebbero i binari della CLI Go
      # dentro una release dell'estensione.
      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: go-ddd-scaffold-${{ needs.decide.outputs.version }}-vsix
          path: extensions/vscode/extension.vsix
          if-no-files-found: error

  publish:
    name: publish
    needs: [decide, package]
    runs-on: ubuntu-latest
    env:
      # Letti qui cosi gli `if` degli step possono verificarne la presenza:
      # senza il secret lo step viene saltato invece di fallire.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce@3 publish --no-dependencies

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1 publish --no-dependencies

      - name: Riepilogo
        run: |
          {
            echo "### Estensione VSCode $VERSION"
            if [ -n "$VSCE_PAT" ]; then
              echo "- Visual Studio Marketplace: pubblicata"
            else
              echo "- Visual Studio Marketplace: **saltata**, manca il secret \`VSCE_PAT\`"
            fi
            if [ -n "$OVSX_PAT" ]; then
              echo "- Open VSX: pubblicata"
            else
              echo "- Open VSX: **saltata**, manca il secret \`OVSX_PAT\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
#
