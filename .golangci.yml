# golangci-lint v2. Update together with the `lint` job in .github/workflows/go.yml
# and with `make lint`, so the local gate and the CI one stay the same gate.
version: "2"

linters:
  # On top of the v2 defaults (errcheck, govet, ineffassign, staticcheck, unused).
  # errcheck is why this file exists: the most expensive bug of the 2026-08-11 audit
  # was the return value of filepath.Walk discarded in getTemplateSets(), which hid
  # every I/O error on the templates.
  enable:
    - bodyclose      # response bodies not closed
    - copyloopvar    # useless copies of the loop variable (Go 1.22+)
    - misspell
    - nilerr         # `return nil` after receiving a non-nil err
    - revive
    - unconvert      # unnecessary type conversions
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank stays OFF on purpose: `_ = f.Close()` is the readable way to
      # declare "error ignored on purpose", and it comes with the reason why.
      # With check-blank ON the only way would be `//nolint`, which says less.
      check-blank: false
    revive:
      rules:
        - name: exported          # exported symbols want a comment
        - name: error-strings     # lowercase errors, no final punctuation
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming

  exclusions:
    paths:
      # Third-party Go code that ended up under the extension's npm dependencies.
      - extensions/
    # In tests verbosity does not pay off: t.Setenv/t.TempDir already fail on their own.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
