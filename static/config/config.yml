# Non-secret tunables. Credentials and per-environment values live in the
# environment (see env/env.go), never here.
http:
  # Overridden by HTTP_ADDR.
  listenAddr: ":8080"
  readTimeout: 15s
  writeTimeout: 15s
#
release:
  releaseVersion: "@RELEASE_VERSION@"
  releaseTime: "@RELEASE_TIME@"
#
database:
  logMode: true
  # Pool sizes come from DB_IDLE_CONN / DB_MAX_CONN.
